name: krishna_jewellers_mobile
description: "Krishna Jewellers — Fine Gold Jewellery. BIS Hallmarked gold jewellery since 1991, Khushipura, Rath, Uttar Pradesh."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  url_launcher: ^6.3.2
  google_fonts: ^8.2.1
  intl: ^0.20.3
  flutter_bloc: ^9.0.0
  equatable: ^2.0.7
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

# ─── Launcher Icon Configuration ────────────────────────────────
# Generates app icon from website logo.png for all Android densities
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/logo.png"
  adaptive_icon_background: "#0B0B0B"   # Website dark gold background
  adaptive_icon_foreground: "assets/images/logo.png"
  min_sdk_android: 23
  web:
    generate: false

# ─── Flutter Assets ─────────────────────────────────────────────
flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/images/
